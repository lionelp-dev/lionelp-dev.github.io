<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon-light.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de réalisations freelance et d'explorations techniques."
    />
    <script>
      (() => {
        const theme = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          theme === "business" || theme === "dark"
            ? "business"
            : theme === "winter" || theme === "light"
              ? "winter"
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "business"
                : "winter";
      })();
    </script>
    <title>Portfolio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
